services:
  backend:
    build:
      context: ./backend
    container_name: ead-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Reflexo imediato de mudanças no reload do uvicorn
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-ead}:${POSTGRES_PASSWORD:-ead}@db:5432/${POSTGRES_DB:-ead}

  db:
    image: postgres:16-alpine
    container_name: ead-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ead}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ead}
      - POSTGRES_DB=${POSTGRES_DB:-ead}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ead_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ead} -d ${POSTGRES_DB:-ead}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ead_pgdata: